<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escucha · ORLI</title>
<link rel="icon" href="orli/favicon.svg" type="image/svg+xml">
<link rel="icon" href="orli/favicon.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="orli/favicon.png">
<link rel="stylesheet" href="orli/charts.css">
<style>
  :root {
    --bg: #f3efe8;
    --paper: #fbf8f3;
    --ink: #2c2824;
    --muted: #7a7268;
    --line: #d9d0c4;
    --sage: #4f5e56;
    --sage-soft: #e7ece8;
    --clay: #8b6f5a;
    --sand: #e4d8c8;
    --bar: #c9b8a4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  h1 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.04em;
    margin: 0 0 6px;
  }

  .lede {
    color: var(--muted);
    font-size: 15px;
    margin: 0 0 36px;
    line-height: 1.45;
  }

  [hidden] { display: none !important; }

  .hint {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.45;
    margin: 0 0 12px;
  }

  button {
    border: none;
    border-radius: 6px;
    padding: 12px 18px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 600;
    letter-spacing: 0.03em;
    cursor: pointer;
    background: var(--sage);
    color: #f7f4ef;
    white-space: nowrap;
  }

  .login {
    max-width: 340px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px 22px;
  }

  .login label {
    display: block;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 14px;
  }

  .login input {
    display: block;
    width: 100%;
    margin-top: 6px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    font-size: 16px;
    font-family: inherit;
  }

  .login button { width: 100%; }
  .login button:disabled { opacity: 0.6; cursor: default; }

  .login .error {
    color: var(--clay);
    font-size: 13px;
    margin: 12px 0 0;
  }

  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px 22px;
    margin-bottom: 18px;
    display: none;
  }

  .card.visible { display: block; }

  .report-frame {
    width: 100%;
    height: 720px;
    border: 0;
    background: var(--paper);
    border-top: 1px solid var(--line);
  }
</style>
</head>
<body>
<main>
  <h1>Escucha</h1>
  <p class="lede" id="lede"></p>

  <form class="login" id="login">
    <label>Usuario
      <input id="login-user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    </label>
    <label>Contraseña
      <input id="login-password" name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit" id="login-submit">Entrar</button>
    <p class="error" id="login-error" role="alert" hidden>Usuario o contraseña incorrectos.</p>
  </form>

  <section class="card" id="analysis-card">
    <div id="report-charts" class="report-charts" hidden></div>
    <iframe
      class="report-frame"
      id="analysis-report"
      title="Reporte de análisis"
      sandbox=""
    ></iframe>
  </section>
</main>
<script src="orli/charts.js"></script>
<script src="orli/report-008.enc.js"></script>
<script>
  const $ = (id) => document.getElementById(id);

  function renderAnalysis(result) {
    renderReportCharts($("report-charts"), result && result.charts);
    const frame = $("analysis-report");
    const reportHtml = (result && result.markdown_html) || "";
    frame.srcdoc = `<!doctype html>
      <html lang="es"><head><meta charset="utf-8"><style>
        :root { color-scheme: light; }
        body {
          margin: 0; padding: 4px 8px 28px; color: #2c2824;
          font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        h1 { font-size: 24px; } h2 { font-size: 20px; } h3 { font-size: 17px; }
        a { color: #4f5e56; }
        table { width: 100%; border-collapse: collapse; margin: 14px 0 24px; }
        th, td { border: 1px solid #d9d0c4; padding: 10px; vertical-align: top; }
        th { background: #e7ece8; text-align: left; }
        tr:nth-child(even) td { background: #fbf8f3; }
        code { font-size: 12px; } sub { color: #7a7268; }
        pre { white-space: pre-wrap; overflow-wrap: anywhere; }
        hr { border: 0; border-top: 1px solid #d9d0c4; margin: 24px 0; }
        figure.bijectivity { margin: 8px 0 22px; }
        figure.bijectivity figcaption { color: #7a7268; font-size: 13px; line-height: 1.45; margin: 0 0 10px; }
        figure.bijectivity svg { display: block; width: 100%; height: auto; }
      </style></head><body>${reportHtml}</body></html>`;
    $("analysis-card").classList.add("visible");
  }

  const fromBase64 = (text) => Uint8Array.from(atob(text), (char) => char.charCodeAt(0));

  async function decryptReport(user, password) {
    const { iterations, salt, iv, data } = window.ORLI_REPORT_ENC;
    const material = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(`${user}:${password}`), "PBKDF2", false, ["deriveKey"]
    );
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", hash: "SHA-256", salt: fromBase64(salt), iterations },
      material,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromBase64(iv) }, key, fromBase64(data));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  $("login").addEventListener("submit", async (event) => {
    event.preventDefault();
    $("login-submit").disabled = true;
    $("login-error").hidden = true;
    try {
      const report = await decryptReport($("login-user").value.trim(), $("login-password").value);
      $("login").hidden = true;
      $("lede").textContent = report.code + " · " + report.title;
      renderAnalysis(report);
    } catch {
      $("login-error").hidden = false;
      $("login-submit").disabled = false;
    }
  });
</script>
</body>
</html>
